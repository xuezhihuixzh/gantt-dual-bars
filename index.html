<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>计划+实际双条（task_template方案，社区免费版）</title>
  <link rel="stylesheet" href="https://cdn.dhtmlx.com/gantt/10.0/dhtmlxgantt.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #f5f5f5;
    }

    .legend {
      margin-bottom: 20px;
      font-size: 14px;
    }

    #gantt_here {
      width: 100%;
      height: 650px;
      background: #fff;
      border: 1px solid #ddd;
    }

    /* 计划基线（底层灰色） - 覆盖默认任务样式 */
    .gantt_task_plan {
      position: absolute;
      height: 14px;
      background: #888 !important;
      border-radius: 4px;
      opacity: 0.6;
      top: 13px;
      border: none !important;
    }

    /* 实际任务（上层绿色） */
    .gantt_task_real {
      position: absolute;
      height: 14px;
      background: #28b972 !important;
      border-radius: 4px;
      top: 0;
      border: none !important;
      color: #fff;
      font-size: 12px;
      line-height: 14px;
      text-align: center;
      overflow: hidden;
    }

    /* 隐藏原生任务条 */
    .gantt_task_content {
      display: none !important;
    }

    .gantt_task {
      background: transparent !important;
      border: none !important;
    }
  </style>
</head>
<body>
  <div class="legend">
    <span style="color:#888;">■ 计划时间(灰色)</span>
    <span style="color:#28b972; margin-left:20px;">■ 实际时间(绿色)</span>
  </div>

  <div id="gantt_here"></div>

  <script src="https://cdn.dhtmlx.com/gantt/10.0/dhtmlxgantt.js"></script>
  <script>
    gantt.config.scales = [
      { unit: "month", step: 1, format: "%Y-%m" },
      { unit: "day", step: 1, format: "%d" }
    ];
    gantt.config.task_height = 36;
    gantt.config.row_height = 40;

    gantt.config.columns = [
      { name: "text", label: "任务名称", tree: true, width: 180 },
      { name: "owner", label: "负责人", align: "center", width: 80 },
      { name: "duration", label: "工期", align: "center", width: 60 },
      { name: "plan_start", label: "计划开始", align: "center", width: 120 },
      { name: "plan_end", label: "计划结束", align: "center", width: 120 },
      { name: "start_date", label: "实际开始", align: "center", width: 120 },
      { name: "end_date", label: "实际结束", align: "center", width: 120 }
    ];

    // 关键：使用 task_template 返回自定义 HTML
    gantt.config.task_template = function(task) {
      if (!task.plan_start || !task.plan_end) {
        return `<div style="height:14px; background:#28b972; border-radius:4px; text-align:center; color:#fff; font-size:11px; line-height:14px;">${task.text}</div>`;
      }
      return `<div style="position:relative; height:28px;">
        <div class="gantt_task_plan" style="width:${task.$plan_width || 100}px;"></div>
        <div class="gantt_task_real" style="width:${task.$real_width || 100}px;">${task.text}</div>
      </div>`;
    };

    // 动态计算条宽度
    gantt.attachEvent("onBeforeTaskDisplay", function(id, task) {
      // 计划条宽度
      if (task.plan_start && task.plan_end) {
        const planStart = new Date(task.plan_start);
        const planEnd = new Date(task.plan_end);
        const posPlan = gantt.getTaskPosition(task, planStart, planEnd);
        task.$plan_width = posPlan.width;
      }
      
      // 实际条宽度
      if (task.start_date && task.end_date) {
        const realStart = new Date(task.start_date);
        const realEnd = new Date(task.end_date);
        const posReal = gantt.getTaskPosition(task, realStart, realEnd);
        task.$real_width = posReal.width;
      }
      
      return true;
    });

    gantt.init("gantt_here");
    gantt.parse({
      data: [
        {
          id: 1,
          text: "B31-01",
          owner: "黎明",
          duration: 7,
          plan_start: "2023-06-13",
          plan_end: "2023-06-21",
          start_date: "2023-06-13",
          end_date: "2023-06-21",
          progress: 0
        },
        {
          id: 2,
          text: "B31-02",
          owner: "黎明",
          duration: 4,
          plan_start: "2023-01-28",
          plan_end: "2023-02-02",
          start_date: "2023-01-28",
          end_date: "2023-02-02",
          progress: 0
        },
        {
          id: 3,
          text: "任务名称b3",
          owner: "黎明",
          duration: 7,
          plan_start: "2023-08-02",
          plan_end: "2023-08-10",
          start_date: "2023-08-02",
          end_date: "2023-08-10",
          progress: 0
        }
      ],
      links: []
    });
  </script>
</body>
</html>
